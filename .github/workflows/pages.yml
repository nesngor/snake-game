name: Publicar en GitHub Pages

# Compila el juego para navegador con pygbag y lo publica en
# https://nesngor.github.io/snake-game/ cada vez que se sube algo a main.
on:
  push:
    branches: [main]
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: snake           # pygbag nombra el paquete segun la carpeta

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pygbag
        run: pip install pygbag==0.9.3

      - name: Compilar version web
        # el servidor en linea y sus reglas no van en el juego del navegador
        run: |
          rm -rf snake/server snake/versus.py
          python -m pygbag --build --title "Snake" snake

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: snake/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
